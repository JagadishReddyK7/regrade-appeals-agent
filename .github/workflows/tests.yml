name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Private test data must not be committed
        run: test -z "$(git ls-files data/cases/test data/private)"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Validate dev cases
        run: python -m data.validate data/cases/dev

      - name: Test
        run: python -m pytest -q -rs
