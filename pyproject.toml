[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regrade-appeals-agent"
version = "0.1.0"
description = "Evidence-checking agent for regrade appeals on Python programming assignments (LMA Group Project 2026, Team Attention Seekers)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "rank-bm25>=0.2.2",
    "openai>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]
gpu = [  # Kaggle only: QLoRA verifier training (verifier/train.py)
    "transformers>=4.45",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "accelerate>=1.0",
]

[tool.setuptools]
packages = ["sandbox", "llm", "agent", "retrieval", "verifier", "baselines", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
