name: pipeline_ft_dev
system: pipeline
cases: data/cases/dev
data_root: data
output_dir: runs
seed: 0
temperature: 0.0
followup: true
llm:
  backend: openai
  base_url: http://localhost:8000/v1
  model: Qwen/Qwen2.5-7B-Instruct-AWQ
  timeout_s: 120
  max_tokens: 1024
  serve:
    gpu: 0
    port: 8000
    dtype: half
    quantization: awq
    max_model_len: 16384
    gpu_memory_utilization: 0.85
    tool_call_parser: hermes
pipeline:
  max_tool_calls: 10
  escalate_below_confidence: 0.0
verifier:
  llm:
    backend: openai
    base_url: http://localhost:8001/v1
    model: /kaggle/temp/verifier-ft
    timeout_s: 60
    max_tokens: 64
    serve:
      gpu: 1
      port: 8001
      dtype: half
      max_model_len: 8192
      gpu_memory_utilization: 0.85
sandbox:
  cache_dir: sandbox/cache
